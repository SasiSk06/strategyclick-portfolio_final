name: Fix hero image source

on:
  push:
    paths:
      - '.github/workflows/fix-hero-src.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero image source
        run: |
          sed -i 's/hero-visual\.webp/hero-visual.jpg/g' index.html
      - name: Commit fix
        run: |
          git config user.name "StrategyClick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use valid JPEG hero image source"
          git push
