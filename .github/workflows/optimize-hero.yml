name: Optimize homepage hero image
on:
  push:
    paths:
      - .github/workflows/optimize-hero.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate mobile WebP from original
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          image = Image.open("hero-visual.webp").convert("RGB")
          image.thumbnail((640, 640))
          image.save("hero-visual-mobile.webp", "WEBP", quality=76, method=6)
          print("Mobile image:", image.size)
          PY
      - name: Commit optimized mobile asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-visual-mobile.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized mobile hero image"
            git push
          fi
