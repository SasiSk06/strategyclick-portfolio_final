name: Apply Final StrategyClick Logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-logo-update.yml'

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Match Facebook footer icon shape
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html')
          text = html.read_text(encoding='utf-8')
          old = '<span class="social-brand" aria-label="Facebook" title="Facebook"><img src="https://cdn.simpleicons.org/facebook/1877F2" alt="Facebook" style="width:28px;height:28px;display:block;object-fit:contain"></span>'
          new = '<span class="social-brand" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:28px;height:28px;display:block"><rect width="32" height="32" rx="6" fill="#1877F2"/><path fill="#fff" d="M18.8 27V17.4h3.2l.5-3.7h-3.7v-2.4c0-1.1.3-1.8 1.9-1.8h2V6.2c-.3 0-1.5-.1-2.9-.1-2.9 0-4.9 1.8-4.9 5v2.6h-3.3v3.7h3.3V27h3.9Z"/></svg></span>'
          if old not in text:
              raise SystemExit('Expected current Facebook icon markup not found')
          html.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "StrategyClick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Match Facebook footer icon shape"
          git push
