name: Apply Hero Full Width Visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-logo-update.yml'

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply full-width hero image with left fade
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('style.css')
          styles = css.read_text(encoding='utf-8')
          marker = '/* HERO FULL-WIDTH BACKGROUND VISUAL */'
          block = '''

/* HERO FULL-WIDTH BACKGROUND VISUAL */
.hero{
  position:relative!important;
  isolation:isolate;
  overflow:hidden!important;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:url("hero-visual.webp");
  background-repeat:no-repeat;
  background-size:cover;
  background-position:center right;
  opacity:.96;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.05) 14%,rgba(0,0,0,.28) 30%,rgba(0,0,0,.72) 48%,#000 64%,#000 100%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.05) 14%,rgba(0,0,0,.28) 30%,rgba(0,0,0,.72) 48%,#000 64%,#000 100%);
}
.hero-grid{
  position:relative!important;
  z-index:2!important;
  grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)!important;
}
.hero-copy{
  position:relative;
  z-index:3;
}
.hero-art{
  visibility:hidden!important;
  pointer-events:none!important;
}
.hero-valuebar{
  position:relative!important;
  z-index:3!important;
}
@media(max-width:900px){
  .hero::after{
    background-position:68% center;
    opacity:.72;
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,.48) 35%,rgba(0,0,0,.88) 100%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,.22) 0%,rgba(0,0,0,.48) 35%,rgba(0,0,0,.88) 100%);
  }
  .hero-grid{grid-template-columns:1fr!important;}
  .hero-art{display:none!important;}
}
'''
          if marker in styles:
              styles = styles.split(marker)[0].rstrip() + block
          else:
              styles += block
          css.write_text(styles, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "StrategyClick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add style.css
          git diff --cached --quiet && exit 0
          git commit -m "Make hero visual full width with left fade"
          git push
