name: Apply Final StrategyClick Logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-logo-update.yml'

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refine Facebook footer icon
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html')
          text = html.read_text(encoding='utf-8')
          old = '<span class="social-brand" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:28px;height:28px;display:block"><circle cx="16" cy="16" r="16" fill="#1877F2"/><path fill="#fff" d="M18.7 27V17.1h3.3l.5-3.9h-3.8v-2.5c0-1.1.3-1.9 1.9-1.9h2V5.3c-.4-.1-1.6-.2-3-.2-3 0-5.1 1.8-5.1 5.2v2.9h-3.4v3.9h3.4V27h4.2Z"/></svg></span>'
          new = '<span class="social-brand" aria-label="Facebook" title="Facebook"><img src="https://cdn.simpleicons.org/facebook/1877F2" alt="Facebook" style="width:28px;height:28px;display:block;object-fit:contain"></span>'
          if old not in text:
              raise SystemExit('Expected Facebook icon markup not found')
          html.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "StrategyClick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine Facebook footer icon"
          git push
