name: Apply Premium Hero Refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-logo-update.yml'

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refine hero
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('style.css')
          styles = css.read_text(encoding='utf-8')
          marker = '/* HERO FULL-WIDTH BACKGROUND VISUAL */'
          block = "\n\n/* HERO FULL-WIDTH BACKGROUND VISUAL */\n.hero{position:relative!important;isolation:isolate;overflow:hidden!important;background:#061A35!important}\n.hero::after{content:\"\";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(90deg,#061A35 0%,rgba(6,26,53,.99) 20%,rgba(6,26,53,.94) 34%,rgba(6,26,53,.78) 46%,rgba(6,26,53,.42) 58%,rgba(6,26,53,.10) 72%,rgba(6,26,53,0) 86%),linear-gradient(180deg,rgba(2,9,20,.02) 58%,rgba(2,9,20,.52) 100%),url(\"hero-visual.webp\");background-repeat:no-repeat;background-size:100% 100%,100% 100%,cover;background-position:center,center,center right}\n.hero-grid{position:relative!important;z-index:2!important;grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr)!important;min-height:510px}\n.hero-copy{position:relative;z-index:3;max-width:610px}\n.hero-copy>p:not(.hero-tagline){max-width:545px!important;text-shadow:0 2px 14px rgba(0,0,0,.36)}\n.hero-art{visibility:hidden!important;pointer-events:none!important}\n.hero-valuebar{position:relative!important;z-index:4!important;margin-top:8px!important;background:rgba(4,18,36,.90)!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:0 18px 45px rgba(0,0,0,.34)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}\n.hero-valuebar>div{background:rgba(6,26,53,.18)}\n@media(max-width:900px){.hero::after{background-image:linear-gradient(180deg,rgba(6,26,53,.74) 0%,rgba(6,26,53,.62) 35%,rgba(6,26,53,.88) 78%,#061A35 100%),url(\"hero-visual.webp\");background-size:100% 100%,cover;background-position:center,66% center}.hero-grid{grid-template-columns:1fr!important;min-height:auto}.hero-copy{max-width:650px}.hero-art{display:none!important}.hero-valuebar{margin-top:24px!important}}\n"
          if marker in styles:
              styles = styles.split(marker)[0].rstrip() + block
          else:
              styles += block
          css.write_text(styles, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "StrategyClick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add style.css
          git diff --cached --quiet && exit 0
          git commit -m "Refine hero to clean premium layout"
          git push
