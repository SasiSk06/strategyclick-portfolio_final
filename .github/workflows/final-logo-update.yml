name: Apply Final StrategyClick Logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-logo-update.yml'

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply white footer brand styling
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('style.css')
          styles = css.read_text(encoding='utf-8')
          marker = '/* FINAL WHITE FOOTER OVERRIDE */'
          block = '''

/* FINAL WHITE FOOTER OVERRIDE */
.footer{
  background:#fff!important;
  color:#123666!important;
  border-top:1px solid rgba(18,54,102,.10)!important;
  box-shadow:0 -10px 34px rgba(18,54,102,.05)!important;
}
.footer-main,
.footer-bottom{
  background:#fff!important;
}
.footer-main nav a,
.footer-bottom p,
.footer a,
.footer span,
.footer strong,
.footer small{
  color:#123666!important;
}
.footer-main nav a:hover{
  color:#F0BE45!important;
}
.footer-bottom{
  border-top:1px solid rgba(18,54,102,.10)!important;
}
.footer-social span{
  border-color:rgba(18,54,102,.18)!important;
  background:#fff!important;
}
.footer-social .linkedin-mark{
  color:#123666!important;
}
.footer-social img{
  filter:none!important;
}
.footer-brand-lockup{
  background:#fff!important;
  border:0!important;
  box-shadow:none!important;
}
.footer-brand-lockup .brand-final-name strong:first-child,
.footer-brand-lockup .brand-final-name b,
.footer-brand-lockup .brand-final-tagline{
  color:#123666!important;
}
.footer-brand-lockup .brand-final-name strong:nth-child(2),
.footer-brand-lockup .brand-final-tagline em{
  color:#F0BE45!important;
}
'''
          if marker in styles:
              styles = styles.split(marker)[0].rstrip() + block
          else:
              styles += block
          css.write_text(styles, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "StrategyClick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add style.css
          git diff --cached --quiet && exit 0
          git commit -m "Switch footer to white and navy brand styling"
          git push
