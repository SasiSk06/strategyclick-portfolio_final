name: Apply Final StrategyClick Logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-logo-update.yml'

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace footer social icons
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html')
          text = html.read_text(encoding='utf-8')
          old = '<div class="footer-social" aria-label="Social media"><span aria-label="LinkedIn" title="LinkedIn"><b class="linkedin-mark" aria-hidden="true">in</b></span><span aria-label="Instagram" title="Instagram"><img src="https://cdn.simpleicons.org/instagram/F4C542" alt=""></span><span aria-label="Facebook" title="Facebook"><img src="https://cdn.simpleicons.org/facebook/F4C542" alt=""></span></div>'
          new = '<div class="footer-social" aria-label="Social media"><span class="social-brand" aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:28px;height:28px;display:block"><rect width="32" height="32" rx="6" fill="#0A66C2"/><path fill="#fff" d="M9.2 12.5H5.8V26h3.4V12.5ZM7.5 6A2 2 0 1 0 7.5 10a2 2 0 0 0 0-4ZM26.2 18.3c0-4.1-2.2-6-5.1-6-2.4 0-3.4 1.3-4 2.2v-1.9h-3.4V26h3.4v-7.5c0-2 .4-3.9 2.8-3.9 2.3 0 2.4 2.2 2.4 4V26h3.4l.5-7.7Z"/></svg></span><span class="social-brand" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:28px;height:28px;display:block"><defs><radialGradient id="igA" cx="30%" cy="107%" r="150%"><stop offset="0" stop-color="#FFD600"/><stop offset=".3" stop-color="#FF7A00"/><stop offset=".6" stop-color="#FF0169"/><stop offset="1" stop-color="#D300C5"/></radialGradient></defs><rect width="32" height="32" rx="8" fill="url(#igA)"/><rect x="7" y="7" width="18" height="18" rx="6" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="16" cy="16" r="4.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="22" cy="10" r="1.4" fill="#fff"/></svg></span><span class="social-brand" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 32 32" aria-hidden="true" style="width:28px;height:28px;display:block"><circle cx="16" cy="16" r="16" fill="#1877F2"/><path fill="#fff" d="M18.7 27V17.1h3.3l.5-3.9h-3.8v-2.5c0-1.1.3-1.9 1.9-1.9h2V5.3c-.4-.1-1.6-.2-3-.2-3 0-5.1 1.8-5.1 5.2v2.9h-3.4v3.9h3.4V27h4.2Z"/></svg></span></div>'
          if old not in text:
              raise SystemExit('Expected footer social markup not found')
          html.write_text(text.replace(old, new, 1), encoding='utf-8')
          css = Path('style.css')
          styles = css.read_text(encoding='utf-8')
          marker = '/* ORIGINAL SOCIAL BRAND ICONS */'
          block = '\n/* ORIGINAL SOCIAL BRAND ICONS */\n.footer-social .social-brand{width:38px!important;height:38px!important;display:grid!important;place-items:center!important;padding:0!important;border:0!important;border-radius:10px!important;background:transparent!important;overflow:hidden;box-shadow:none!important}.footer-social .social-brand:hover{transform:translateY(-3px);background:transparent!important}\n'
          if marker not in styles:
              css.write_text(styles + block, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "StrategyClick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html style.css
          git diff --cached --quiet && exit 0
          git commit -m "Use original social brand icons in footer"
          git push
